צעות לפי תוויות האינדקס, לא לפי המיקום. רק y קיים בשניהם (2 + 10 = 12). x ו-z קיימים רק באחד מהם, ולכן התוצאה שם היא NaN.", "why": ["החיבור לא לפי מיקום אלא לפי אינדקס.", "נכון: יישור לפי אינדקס.", "pandas לא משאיר ערך כשהוא חסר באחד הצדדים. הוא שם NaN. (`a.add(b, fill_value=0)` היה נותן את זה.)", "אינדקסים שונים לא זורקים שגיאה, הם מתיישרים."], "title": "טריק מתקדם", "out": "[nan, 12.0, nan]"}, {"cat": "pandas", "code": "import pandas as pd\n\ndf = pd.DataFrame({\"price\": [5, 40, 12], \"qty\": [10, 1, 3]})\ndf[\"total\"] = df[\"price\"] * df[\"qty\"]\nprint(df[\"total\"].tolist(), (df[\"total\"] > 40).sum(), df[\"total\"].max())", "opts": ["[50, 40, 36] 1 50", "[50, 40, 36] 2 50", "[15, 41, 15] 0 41", "[50, 40, 36] [True, False, False] 50"], "ans": 0, "explain": "פעולה בין עמודות מתבצעת שורה מול שורה. השוואה יוצרת Series של True/False, ו-`sum` סופר כמה True יש. 40 > 40 הוא False.", "why": ["נכון.", "40 לא גדול מ-40.", "`*` הוא כפל, לא חיבור.", "`.sum()` הופך את ה-True/False למספר."], "title": "", "out": "[50, 40, 36] 1 50"}, {"cat": "pandas", "code": "import pandas as pd\n\ndf = pd.DataFrame({\"n\": range(8)})\nprint(len(df.head()), len(df.tail(3)), df.head(2)[\"n\"].tolist())", "opts": ["5 3 [0, 1]", "8 3 [0, 1]", "10 3 [0, 1]", "5 3 [6, 7]"], "ans": 0, "explain": "`head()` בלי מספר מחזיר 5 שורות ראשונות. `tail(3)` מחזיר 3 אחרונות. `head(2)` מחזיר 2 ראשונות.", "why": ["נכון.", "head מחזיר חלק מהשורות, לא את כולן.", "ברירת המחדל היא 5, לא 10.", "head הוא מההתחלה, tail הוא מהסוף."], "title": "", "out": "5 3 [0, 1]"}, {"cat": "pandas", "code": "import pandas as pd\n\ndf = pd.DataFrame({\"a\": [1, None, 3], \"b\": [None, None, 6]})\nprint(len(df.dropna()), len(df), df.fillna(0)[\"b\"].tolist())", "opts": ["1 3 [0.0, 0.0, 6.0]", "1 1 [0.0, 0.0, 6.0]", "2 3 [0, 0, 6]", "0 3 [0.0, 0.0, 6.0]"], "ans": 0, "explain": "`dropna` מוחק כל שורה שיש בה ערך חסר אחד לפחות, אז נשארת רק השורה האחרונה. גם dropna וגם fillna מחזירים DataFrame חדש, ו-df עצמו לא משתנה. העמודה היא float בגלל ה-None, ולכן 0.0.", "why": ["נכון.", "dropna לא שינה את df, כי התוצאה לא נשמרה.", "רק בשורה האחרונה אין ערכים חסרים, והעמודה היא float.", "השורה האחרונה מלאה (3, 6), אז היא נשארת."], "title": "", "out": "1 3 [0.0, 0.0, 6.0]"}, {"cat": "pandas", "code": "import numpy as np\nimport pandas as pd\n\ns = pd.Series([1, np.nan, 3])\nprint(np.nan == np.nan, (s == np.nan).sum(), s.isna().sum())", "opts": ["True 1 1", "False 0 1", "False 1 1", "True 0 1"], "ans": 1, "explain": "NaN לא שווה לשום דבר, אפילו לא לעצמו. לכן השוואה עם `== np.nan` לא מוצאת אף ערך חסר. הדרך הנכונה לבדוק: `isna()`.", "why": ["NaN == NaN הוא False.", "נכון.", "השוואה ל-NaN תמיד False, אז הסכום 0.", "NaN לא שווה לעצמו."], "title": "טריק", "out": "False 0 1"}, {"cat": "pandas", "code": "import pandas as pd\n\ndf = pd.DataFrame({\"name\": [\" dana \", \"GIL\", \"noa levi\"]})\nprint(df[\"name\"].str.strip().str.title().tolist())", "opts": ["['Dana', 'Gil', 'Noa Levi']", "[' Dana ', 'Gil', 'Noa levi']", "['Dana', 'GIL', 'Noa levi']", "ERR:AttributeError"], "ans": 0, "explain": "`.str` מאפשר להפעיל מתודות של מחרוזת על כל העמודה בבת אחת. `strip` מסיר רווחים, ו-`title` הופך את האות הראשונה בכל מילה לגדולה ואת השאר לקטנות.", "why": ["נכון.", "strip כבר הסיר את הרווחים, ו-title מגדיל כל מילה.", "title גם מקטין את שאר האותיות.", "`.str` הוא accessor קיים בעמודות טקסט."], "title": "", "out": "['Dana', 'Gil', 'Noa Levi']"}, {"cat": "pandas", "code": "import pandas as pd\n\nstudents = pd.DataFrame({\"id\": [1, 2, 3], \"name\": [\"Dana\", \"Gil\", \"Noa\"]})\ngrades = pd.DataFrame({\"id\": [1, 3, 4], \"grade\": [90, 80, 70]})\nmerged = pd.merge(students, grades, on=\"id\")\nprint(merged[\"name\"].tolist(), merged.shape)", "opts": ["['Dana', 'Gil', 'Noa'] (3, 3)", "['Dana', 'Noa'] (2, 3)", "['Dana', 'Noa'] (2, 4)", "['Dana', 'Gil', 'Noa', nan] (4, 3)"], "ans": 1, "explain": "`merge` מחבר טבלאות לפי עמודה משותפת. ברירת המחדל היא inner join: נשארות רק השורות שה-id שלהן קיים בשתי הטבלאות (1 ו-3). עמודת id מופיעה פעם אחת.", "why": ["Gil (id 2) לא קיים בטבלת הציונים, אז הוא לא נכנס ב-inner join.", "נכון.", "id משותף ולא משוכפל, אז יש 3 עמודות.", "זה מה שמתקבל עם `how=\"outer\"`."], "title": "", "out": "['Dana', 'Noa'] (2, 3)"}, {"cat": "dicts", "code": "d = {}\nd.setdefault(\"a\", []).append(1)\nd.setdefault(\"a\", []).append(2)\nprint(d, d.setdefault(\"b\", 0))", "opts": ["{'a': [1, 2]} 0", "{'a': [1, 2], 'b': 0} 0", "{'a': [2]} 0", "{'a': [1, 2], 'b': 0} None"], "ans": 1, "explain": "`setdefault` מחזיר את הערך הקיים, ואם המפתח לא קיים הוא מכניס את ערך ברירת המחדל ומחזיר אותו. בפעם השנייה \"a\" כבר קיים, אז ה-append הולך לאותה רשימה. ו-print מחשב את כל הארגומנטים לפני שהוא מדפיס, כך שגם \"b\" כבר נכנס למילון.", "why": ["print מחשב את כל הארגומנטים לפני ההדפסה, אז d כבר כולל את b.", "נכון.", "בפעם השנייה setdefault מחזיר את הרשימה הקיימת ולא יוצר חדשה.", "setdefault מחזיר את הערך שהוכנס, 0."], "title": "טריק", "out": "{'a': [1, 2], 'b': 0} 0"}, {"cat": "dicts", "code": "from collections import defaultdict\n\nd = defaultdict(int)\nfor w in [\"a\", \"b\", \"a\"]:\n    d[w] += 1\nprint(d[\"a\"], d[\"z\"], len(d))", "opts": ["2 0 2", "2 0 3", "ERR:KeyError", "2 None 2"], "ans": 1, "explain": "ב-`defaultdict(int)` גישה למפתח חסר יוצרת אותו עם 0, בלי KeyError. אבל זה קורה גם כשרק קוראים: `d[\"z\"]` הכניס את z למילון, ולכן יש 3 מפתחות.", "why": ["קריאה של `d[\"z\"]` הוסיפה מפתח חדש.", "נכון.", "defaultdict לא זורק KeyError, הוא יוצר ערך.", "int() מחזיר 0, לא None."], "title": "טריק", "out": "2 0 3"}, {"cat": "dicts", "code": "a = {\"x\": 1, \"y\": 2}\nb = {\"y\": 20, \"z\": 30}\nprint(a | b, {**b, **a})", "opts": ["{'x': 1, 'y': 20, 'z': 30} {'y': 2, 'z': 30, 'x': 1}", "{'x': 1, 'y': 2, 'z': 30} {'y': 20, 'z': 30, 'x': 1}", "{'x': 1, 'y': 20, 'z': 30} {'x': 1, 'y': 2, 'z': 30}", "ERR:TypeError"], "ans": 0, "explain": "גם `|` (מפייתון 3.9) וגם `{**a, **b}` ממזגים מילונים. כשיש מפתח כפול, הערך מהמילון הימני מנצח. סדר המפתחות נקבע לפי ההופעה הראשונה של כל מפתח.", "why": ["נכון.", "הימני מנצח: ב-`a | b`, y הוא 20.", "הסדר נקבע לפי ההופעה הראשונה. ב-`{**b, **a}` המפתח y מגיע ראשון.", "`|` בין מילונים חוקי מפייתון 3.9."], "title": "", "out": "{'x': 1, 'y': 20, 'z': 30} {'y': 2, 'z': 30, 'x': 1}"}, {"cat": "dicts", "code": "scores = {\"dana\": 90, \"gil\": 75, \"noa\": 82}\ntop = sorted(scores, key=scores.get, reverse=True)\nprint(top[0], max(scores), min(scores.values()))", "opts": ["dana dana 75", "dana noa 75", "dana 90 75", "90 noa gil"], "ans": 1, "explain": "`sorted(scores, key=scores.get)` ממיין את המפתחות לפי הערכים. אבל `max(scores)` בלי key עובד על המפתחות עצמם, כלומר לפי אלפבית: noa. כדי לקבל את בעל הציון הגבוה: `max(scores, key=scores.get)`.", "why": ["`max(scores)` משווה את שמות המפתחות, לא את הציונים.", "נכון: מלכודת נפוצה.", "max על מילון מחזיר מפתח, לא ערך.", "sorted על מילון מחזיר מפתחות, לא ערכים."], "title": "טריק", "out": "dana noa 75"}, {"cat": "dicts", "code": "d = {\"a\": 1}\nkeys = d.keys()\nd[\"b\"] = 2\nprint(list(keys), len(keys))", "opts": ["['a'] 1", "['a', 'b'] 2", "['a'] 2", "ERR:RuntimeError"], "ans": 1, "explain": "`keys()` מחזיר תצוגה (view) חיה של המילון, לא עותק. כשהמילון משתנה, גם התצוגה משתקפת. לעותק קבוע: `list(d.keys())`.", "why": ["keys() לא מעתיק. הוא משקף את המצב הנוכחי.", "נכון.", "list ו-len רואים את אותו מצב.", "השינוי לא קרה תוך כדי מעבר על המילון."], "title": "טריק", "out": "['a', 'b'] 2"}, {"cat": "dicts", "code": "d = {\"a\": 1, \"b\": 2, \"c\": 1}\ninv = {v: k for k, v in d.items()}\nprint(inv)", "opts": ["{1: 'a', 2: 'b'}", "{1: 'c', 2: 'b'}", "{1: ['a', 'c'], 2: 'b'}", "ERR:KeyError"], "ans": 1, "explain": "היפוך מילון: הערכים הופכים למפתחות. לערך 1 יש שני מפתחות (a ו-c), וההשמה האחרונה דורסת את הקודמת, אז נשאר c. סדר המפתחות נקבע לפי ההופעה הראשונה של 1.", "why": ["c נכתב אחרי a ודורס אותו.", "נכון.", "comprehension לא אוסף לרשימה, הוא דורס.", "אין גישה למפתח חסר."], "title": "", "out": "{1: 'c', 2: 'b'}"}, {"cat": "dicts", "code": "d = {\"name\": \"Dana\", \"age\": 25}\nprint(\"Dana\" in d, \"name\" in d, \"Dana\" in d.values())", "opts": ["True True True", "False True True", "True True False", "False True False"], "ans": 1, "explain": "`in` על מילון בודק רק מפתחות. כדי לבדוק ערך משתמשים ב-`d.values()`.", "why": ["\"Dana\" הוא ערך, לא מפתח.", "נכון.", "`d.values()` כולל את \"Dana\".", "\"Dana\" נמצא בין הערכים."], "title": "", "out": "False True True"}, {"cat": "strings", "code": "s = \"banana\"\nt = s.replace(\"a\", \"o\", 2)\nprint(s, t, s.count(\"an\"))", "opts": ["bonona bonona 2", "banana bonona 2", "banana bonono 2", "banana bonona 3"], "ans": 1, "explain": "`replace` מחזיר מחרוזת חדשה ולא משנה את s. הארגומנט השלישי מגביל את מספר ההחלפות ל-2 הראשונות. \"an\" מופיע פעמיים ב-banana.", "why": ["s לא משתנה, מחרוזות הן immutable.", "נכון.", "רק 2 החלפות, אז ה-a האחרון נשאר.", "count סופר הופעות שלא חופפות: b-an-an-a, כלומר 2."], "title": "", "out": "banana bonona 2"}, {"cat": "strings", "code": "print(\"123\".isdigit(), \"12.5\".isdigit(), \"-5\".isdigit(), \" \".isspace())", "opts": ["True True True True", "True False False True", "True False True True", "True False False False"], "ans": 1, "explain": "`isdigit` מחזיר True רק אם כל התווים הם ספרות. נקודה ומינוס אינם ספרות, אז אי אפשר להשתמש בו לבדוק מספרים שליליים או עשרוניים. לזה עדיף try/except עם float.", "why": ["נקודה ומינוס אינם ספרות.", "נכון.", "המינוס אינו ספרה.", "רווח הוא תו לבן, אז isspace מחזיר True."], "title": "טריק", "out": "True False False True"}, {"cat": "strings", "code": "f = \"report.PDF\"\nprint(f.endswith(\".pdf\"), f.lower().endswith((\".pdf\", \".doc\")), f.split(\".\")[-1])", "opts": ["True True PDF", "False True PDF", "False False pdf", "False True pdf"], "ans": 1, "explain": "`endswith` רגיש לאותיות גדולות וקטנות, לכן כדאי `lower()` קודם. אפשר להעביר tuple כדי לבדוק כמה סיומות בבת אחת. `split` לא משנה את האותיות.", "why": ["\".PDF\" לא שווה ל-\".pdf\".", "נכון.", "אחרי lower הבדיקה מצליחה.", "split לא מקטין אותיות."], "title": "", "out": "False True PDF"}, {"cat": "strings", "cod ן.", "החלקים הומרו ל-int לפני החיבור.", "`cls(...)` יוצר Date.", "מספר הארגומנטים תואם."], "title": "", "out": "22 Date"}, {"cat": "classes", "code": "class Account:\n    def __init__(self):\n        self.__balance = 100\n\na = Account()\nprint(a._Account__balance)\nprint(a.__balance)", "opts": ["100\n100", "100\nERR:AttributeError", "ERR:AttributeError", "None\n100"], "ans": 1, "explain": "שני קווים תחתונים מפעילים name mangling: השם נשמר בפועל כ-`_Account__balance`. זה לא באמת פרטי, אבל `a.__balance` מבחוץ לא נמצא.", "why": ["מבחוץ השם `__balance` לא קיים.", "נכון.", "השם המעוות נגיש.", "הערך הוא 100."], "title": "טריק", "out": "100\nERR:AttributeError"}, {"cat": "tricks", "code": "x = [0, 0]\ni = 0\ni, x[i] = 1, 5\nprint(x)", "opts": ["[5, 0]", "[0, 5]", "[1, 5]", "ERR:IndexError"], "ans": 1, "explain": "בהשמה מרובה, הצד הימני מחושב קודם, ואז ההשמות מתבצעות משמאל לימין. i מקבל 1, ורק אז `x[i] = 5`, כלומר `x[1]`.", "why": ["i כבר שונה ל-1 לפני ההשמה ל-x[i].", "נכון: טריק מתקדם.", "x[0] לא משתנה.", "x[1] קיים."], "title": "טריק מתקדם", "out": "[0, 5]"}, {"cat": "tricks", "code": "words = [\"kiwi\", \"fig\", \"banana\", \"plum\"]\nprint(max(words, key=len), min(words, key=len), max([], default=\"none\"))", "opts": ["plum fig none", "banana fig none", "banana fig ERR:ValueError", "banana kiwi none"], "ans": 1, "explain": "`key=len` משווה לפי אורך. `default` מונע את ה-ValueError שהיה נזרק מ-max על רשימה ריקה.", "why": ["max לפי key=len משווה אורכים, לא אלפבית.", "נכון.", "default מונע את השגיאה.", "fig הקצרה ביותר."], "title": "", "out": "banana fig none"}, {"cat": "tricks", "code": "print([x if x > 2 else 0 for x in range(5)], [x for x in range(5) if x > 2])", "opts": ["[3, 4] [3, 4]", "[0, 0, 0, 3, 4] [3, 4]", "[0, 0, 0, 3, 4] [0, 0, 0, 3, 4]", "ERR:SyntaxError"], "ans": 1, "explain": "`if/else` לפני ה-for משנה כל ערך (ולכן האורך נשאר 5). `if` אחרי ה-for מסנן איברים החוצה.", "why": ["if/else לפני ה-for לא מסנן.", "נכון.", "if אחרי ה-for כן מסנן.", "שני התחבירים חוקי "}, {"cat": "tuples", "code": "s = {[1, 2], [3]}\nprint(s)", "opts": ["{[1, 2], [3]}", "ERR:TypeError", "{1, 2, 3}", "{(1, 2), (3,)}"], "ans": 1, "explain": "איברי set חייבים להיות hashable, ורשימה אינה כזו. אפשר להשתמש ב-tuple: `{(1, 2), (3,)}`.", "why": ["רשימה לא יכולה להיות איבר ב-set.", "נכון: unhashable type: 'list'.", "set לא מפרק רשימות פנימיות.", "פייתון לא ממיר אוטומטית ל-tuple."], "title": "באג", "out": "ERR:TypeError"}, {"cat": "tuples", "code": "a = {1, 2}\nb = {1, 2, 3}\nprint(a <= b, a < a, b >= a, a.isdisjoint({3}))", "opts": ["True True True True", "True False True True", "True False True False", "False False True True"], "ans": 1, "explain": "`<=` הוא תת-קבוצה, `<` הוא תת-קבוצה ממש (לא שווה), ו-`isdisjoint` בודק שאין איברים משותפים. a לא תת-קבוצה ממש של עצמה.", "why": ["`a < a` הוא False כי הן שוות.", "נכון.", "אין ל-a איבר 3, אז הן זרות.", "a תת-קבוצה של b."], "title": "", "out": "True False True True"}, {"cat": "tuples", "code": "from collections import namedtuple\n\nPoint = namedtuple(\"Point\", [\"x\", \"y\"])\np = Point(3, 4)\nprint(p.x + p[1], p)", "opts": ["7 (3, 4)", "7 Point(x=3, y=4)", "ERR:AttributeError", "34 Point(x=3, y=4)"], "ans": 1, "explain": "namedtuple הוא tuple עם שמות לשדות. אפשר לגשת גם לפי שם וגם לפי אינדקס, וה-repr שלו כולל את השמות.", "why": ["ה-repr של namedtuple כולל את שמות השדות.", "נכון.", "x קיים כשדה.", "הערכים הם מספרים, אז החיבור חשבוני."], "title": "", "out": "7 Point(x=3, y=4)"}, {"cat": "functions", "code": "def describe(name, age=0, city=\"?\"):\n    return f\"{name}-{age}-{city}\"\n\nprint(describe(\"Dana\", city=\"Haifa\"), describe(age=5, name=\"Gil\"))", "opts": ["Dana-Haifa-? Gil-5-?", "Dana-0-Haifa Gil-5-?", "ERR:TypeError", "Dana-0-Haifa 5-Gil-?"], "ans": 1, "explain": "ארגומנטים בשם משויכים לפי השם, לא לפי המיקום, ומותר לשלוח אותם בכל סדר. מה שלא נשלח מקבל את ברירת המחדל.", "why": ["`city=\"Haifa\"` הולך ל-city.", "נכון.", "כל הקריאות תקינות.", "name=\"Gil\" משויך לפי שם."], "title": "", "out": "Dana-0-Haifa Gil-5-?"}, {"cat": "functions", "code": "def f(a, b):\n    return a - b\n\nprint(f(b=1, 5))", "opts": ["4", "-4", "ERR:SyntaxError", "ERR:TypeError"], "ans": 2, "explain": "אסור לשים ארגומנט לפי מיקום אחרי ארגומנט בשם. השגיאה מתגלה עוד לפני הריצה: positional argument follows keyword argument.", "why": ["הקוד לא רץ בכלל.", "פייתון לא מנחש שה-5 שייך ל-a.", "נכון.", "השגיאה תחבירית, עוד לפני הקריאה."], "title": "באג", "out": "ERR:SyntaxError"}, {"cat": "functions", "code": "def f(n):\n    if n <= 1:\n        return 1\n    return n * f(n - 1)\n\nprint(f(5), f(0))", "opts": ["120 0", "120 1", "24 1", "ERR:RecursionError"], "ans": 1, "explain": "רקורסיה: f(5) = 5 · 4 · 3 · 2 · 1 = 120. תנאי העצירה `n <= 1` מחזיר 1, גם עבור 0 (0! = 1).", "why": ["עבור 0 תנאי העצירה מחזיר 1.", "נכון.", "f(5) כולל גם את 5.", "יש תנאי עצירה."], "title": "", "out": "120 1"}, {"cat": "functions", "code": "def multiplier(n):\n    return lambda x: x * n\n\ndouble = multiplier(2)\ntriple = multiplier(3)\nprint(double(5), triple(double(2)), multiplier(10)(1))", "opts": ["10 12 10", "10 6 10", "10 12 1", "ERR:TypeError"], "ans": 0, "explain": "כל קריאה ל-multiplier מחזירה פונקציה חדשה שזוכרת את n שלה (closure). triple(double(2)) = triple(4) = 12. `multiplier(10)(1)` יוצר פונקציה וקורא לה מיד.", "why": ["נכון.", "double(2) הוא 4, ו-triple(4) הוא 12.", "multiplier(10)(1) = 1 · 10.", "מותר לקרוא לפונקציה שמוחזרת מיד."], "title": "", "out": "10 12 10"}, {"cat": "functions", "code": "counter = 0\n\ndef inc():\n    global counter\n    counter += 1\n    return counter\n\ninc()\ninc()\nprint(counter, inc())", "opts": ["0 1", "2 3", "3 3", "ERR:UnboundLocalError"], "ans": 1, "explain": "`global` מאפשר לפונקציה לשנות את המשתנה הגלובלי. אחרי שתי קריאות counter הוא 2. הארגומנטים של print מחושבים משמאל לימין: קודם counter (2), ואז inc() (3).", "why": ["global משנה את המשתנה החיצוני.", "נכון.", "counter נקרא לפני הקריאה השלישית.", "global מונע את השגיאה."], "title": "", "out": "2 3"}, {"cat": "functions", ain": "zip נעצר ברשימה הקצרה, אז Noa לא מופיעה. `enumerate(..., start=1)` מתחיל לספור מ-1. `(n, a)` מפרק כל זוג של zip.", "why": ["נכון.", "start=1 מתחיל מ-1.", "zip לא ממלא ערכים חסרים.", "כל זוג מתפרק לשני משתנים."], "title": "", "out": "1 Dana 25\n2 Gil 30"}, {"cat": "loops", "code": "for i in range(0, 1, 0.5):\n    print(i)", "opts": ["0\n0.5", "ERR:TypeError", "ERR:ValueError", "0"], "ans": 1, "explain": "range עובד רק עם מספרים שלמים. לצעדים עשרוניים אפשר `[i / 2 for i in range(2)]`.", "why": ["range לא מקבל float.", "נכון: 'float' object cannot be interpreted as an integer.", "הבעיה היא הטיפוס, לא הערך.", "שום דבר לא מודפס."], "title": "באג", "out": "ERR:TypeError"}, {"cat": "loops", "code": "prices = {\"pen\": 5, \"book\": 40}\nfor k in prices:\n    prices[k] *= 2\nprint(prices)", "opts": ["{'pen': 5, 'book': 40}", "{'pen': 10, 'book': 80}", "ERR:RuntimeError", "{'pen': 10, 'book': 40}"], "ans": 1, "explain": "מותר לשנות ערכים של מפתחות קיימים תוך כדי מעבר על מילון. אסור רק להוסיף או למחוק מפתחות.", "why": ["השינוי נשמר במילון.", "נכון.", "RuntimeError מתקבל רק כשגודל המילון משתנה.", "הלולאה עוברת על כל המפתחות."], "title": "טריק", "out": "{'pen': 10, 'book': 80}"}, {"cat": "exceptions", "code": "def f():\n    try:\n        return 1\n    finally:\n        return 2\n\nprint(f())", "opts": ["1", "2", "1\n2", "ERR:SyntaxError"], "ans": 1, "explain": "finally רץ תמיד, גם אחרי return. אם יש בו return משלו, הוא דורס את הערך הקודם. זה הרגל רע (בגרסאות חדשות פייתון מזהיר עליו), אבל הקוד עובד.", "why": ["ה-return ב-finally דורס.", "נכון.", "רק ערך אחד מוחזר.", "return בתוך finally חוקי."], "title": "טריק מתקדם", "out": "2"}, {"cat": "exceptions", "code": "try:\n    try:\n        1 / 0\n    finally:\n        print(\"inner finally\")\nexcept ZeroDivisionError:\n    print(\"outer caught\")", "opts": ["outer caught", "inner finally\nouter caught", "outer caught\ninner finally", "inner finally\nERR:ZeroDivisionError"], "ans": 1, "explain": "ל-try הפנימי אין except, אז החר s f:\n    f.write(\"id,name,age,city\\n\")\n    for i in range(1, 101):\n        f.write(f\"{i},user{i},{20 + i % 30},Haifa\\n\")\n\ndf = pd.read_csv(\"big.csv\", usecols=[\"id\", \"age\"], nrows=10)\nprint(df.shape, df.columns.tolist(), df[\"id\"].iloc[-1])", "opts": ["(100, 4) ['id', 'name', 'age', 'city'] 100", "(10, 2) ['id', 'age'] 10", "(10, 2) ['id', 'age'] 9", "(11, 2) ['id', 'age'] 10"], "ans": 1, "explain": "`usecols` קורא רק את העמודות שביקשת, ו-`nrows` רק את מספר השורות הראשונות (בלי הכותרת). זה חוסך זיכרון בקבצים גדולים.", "why": ["usecols ו-nrows מגבילים את הקריאה.", "נכון.", "ה-id האחרון בשורה העשירית הוא 10, כי ה-id מתחיל מ-1.", "nrows לא סופר את שורת הכותרת."], "title": "CSV", "out": "(10, 2) ['id', 'age'] 10"}, {"cat": "pandas", "code": "import pandas as pd\n\ndf = pd.DataFrame({\"x\": [5, 15, 25, 35]})\nbig = df[df[\"x\"] > 10]\nprint(big.index.tolist(), big.reset_index(drop=True).index.tolist(), big.reset_index().columns.tolist())", "opts": ["[1, 2, 3] [0, 1, 2] ['index', 'x']", "[0, 1, 2] [0, 1, 2] ['x']", "[1, 2, 3] [0, 1, 2] ['x']", "[1, 2, 3] [1, 2, 3] ['index', 'x']"], "ans": 0, "explain": "אחרי סינון האינדקס המקורי נשמר. `reset_index` ממספר מחדש מ-0. בלי `drop=True` האינדקס הישן הופך לעמודה בשם index.", "why": ["נכון.", "הסינון לא מאפס את האינדקס.", "בלי drop=True נוספת עמודה בשם index.", "reset_index ממספר מחדש."], "title": "", "out": "[1, 2, 3] [0, 1, 2] ['index', 'x']"}, {"cat": "pandas", "code": "import pandas as pd\n\na = pd.DataFrame({\"v\": [1, 2]})\nb = pd.DataFrame({\"v\": [3]})\nc = pd.concat([a, b])\nd = pd.concat([a, b], ignore_index=True)\nprint(c.index.tolist(), d.index.tolist(), c[\"v\"].sum())", "opts": ["[0, 1, 2] [0, 1, 2] 6", "[0, 1, 0] [0, 1, 2] 6", "[0, 1, 0] [0, 1, 0] 6", "ERR:ValueError"], "ans": 1, "explain": "`concat` מחבר טבלאות זו מתחת לזו ושומר את האינדקסים המקוריים, ולכן 0 מופיע פעמיים. זה יכול לבלבל את `loc`. `ignore_index=True` ממספר מחדש.", "why": ["concat לא ממספר מחדש בלי ignore_index.", "נכון.", "ignore_index=True ממספר מחדש.", "אינדקסים כפולים מותרים."], "title": "טריק", "out": "[0, 1, 0] [0, 1, 2] 6"}]</script>
<script>
(function(){
const Q = JSON.parse(document.getElementById('data').textContent);
Q.forEach((q,i)=>q.id=i);
const CATS = [
  ['all','הכול'],['vars','משתנים'],['cond','תנאים'],['loops','לולאות'],
  ['lists','רשימות'],['tuples','tuple ו-set'],['dicts','מילונים'],['strings','מחרוזות'],
  ['functions','פונקציות'],['exceptions','ניהול שגיאות'],['raise','איזו חריגה?'],['files','קבצים'],['pandas','Pandas'],['classes','מחלקות'],['poly','פולימורפיזם'],
  ['iter','גנרטורים'],['tricks','טריקים'],['bugs','באגים ושגיאות'],['mine','מהקוד שלך']
];
const CATNAME = Object.fromEntries(CATS);
const LETTERS = ['א','ב','ג','ד'];
const isBug = q => q.out.includes('ERR:') || /באג/.test(q.title);
const inCat = (q,c) => c==='all' || q.cat===c || (c==='bugs' && isBug(q)) || (c==='mine' && q.title==='מהקוד שלך');

const KEY='mah-hapelet-v1';
let st = {answers:{}, perm:{}, order:null, cat:'all', pos:0, curId:null, savedAt:null, tab:'practice'};
let restored=false;
let storageOk=true;
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.answers){ st=Object.assign(st,s); restored=Object.keys(s.answers).length>0; } }catch(e){storageOk=false}
const save=()=>{
  const q=visible()[st.pos]; if(q) st.curId=q.id;
  try{ st.savedAt=Date.now(); localStorage.setItem(KEY,JSON.stringify(st)); storageOk=true; }catch(e){ storageOk=false; }
  renderSaved();
};

function shuffled(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
Q.forEach(q=>{ if(!st.perm[q.id]) st.perm[q.id]=shuffled(4); });
if(!st.order) st.order=Q.map(q=>q.id);
st.order=st.order.filter(i=>i<Q.length);
Q.forEach(q=>{ if(!st.order.includes(q.id)) st.order.push(q.id); });

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');

// ---------- syntax highlighting ----------
const KW=new Set('def class return if elif else for while in not and or is None True False try except finally with as import from lambda pass break continue global nonlocal yield raise del assert'.split(' '));
const BI=new Set('print len range list dict set tuple str int float bool sorted zip enumerate repr round min max sum super isinstance type open input abs map filter'.split(' '));
const TOK=/(#.*$)|((?:f|r|b)?(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'))|(@\w+)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*\b)/gm;
function hl(line){
  let out='',last=0,m,prevKw=''; TOK.lastIndex=0;
  while((m=TOK.exec(line))){
    out+=esc(line.slice(last,m.index)); last=TOK.lastIndex;
    const t=m[0];
    if(m[1]) out+=`<span class="tk-cm">${esc(t)}</span>`;
    else if(m[2]) out+=`<span class="tk-str">${esc(t)}</span>`;
    else if(m[3]) out+=`<span class="tk-dec">${esc(t)}</span>`;
    else if(m[4]) out+=`<span class="tk-num">${t}</span>`;
    else if(KW.has(t)){ out+=`<span class="tk-kw">${t}</span>`; prevKw=t; continue; }
    else if(prevKw==='def'||prevKw==='class') out+=`<span class="tk-fn">${t}</span>`;
    else if(BI.has(t)||t==='self') out+=`<span class="tk-bi">${t}</span>`;
    else out+=esc(t);
    prevKw='';
  }
  return out+esc(line.slice(last));
}
function codeBlock(src){
  const rows=src.split('\n').map((l,i)=>`<tr><td class="ln">${i+1}</td><td>${hl(l)||' '}</td></tr>`).join('');
  return `<div class="code" dir="ltr"><table>${rows}</table></div>`;
}
function outHtml(s){
  return s.split('\n').map(l=> l.startsWith('ERR:') ? `<span class="err">שגיאה</span>${esc(l.slice(4))}` : esc(l)).join('\n');
}

// ---------- rendering ----------
const $=id=>document.getElementById(id);
const visible=()=>st.order.map(i=>Q[i]).filter(q=>inCat(q,st.cat));

function renderCats(){
  $('cats').innerHTML=CATS.map(([k,n])=>{
    const c=Q.filter(q=>inCat(q,k)).length;
    return `<button class="chip" data-cat="${k}" aria-pressed="${st.cat===k}">${n}<small>${c}</small></button>`;
  }).join('');
}
function renderStats(){
  const list=visible();
  const ans=list.filter(q=>st.answers[q.id]!==undefined);
  const ok=ans.filter(q=>st.answers[q.id]===q.ans).length;
  $('sScore').textContent=ok;
  $('sDone').textContent=`${ans.length}/${list.length}`;
  $('sPct').textContent=ans.length?Math.round(ok/ans.length*100)+'%':'–';
  $('pG').style.width=(list.length?ok/list.length*100:0)+'%';
  $('pB').style.width=(list.length?(ans.length-ok)/list.length*100:0)+'%';
  const done=$('doneBox');
  if(list.length && ans.length===list.length){
    done.hidden=false;
    done.innerHTML=`<div class="done"><b>סיימת את כל ${list.length} השאלות בנושא "${CATNAME[st.cat]}"</b>ענית נכון על ${ok} מתוך ${list.length}. אפשר לעבור לנושא אחר, או לאפס ולנסות שוב.</div>`;
  } else done.hidden=true;
}
function renderDots(){
  const list=visible();
  $('dots').innerHTML=list.map((q,i)=>{
    const a=st.answers[q.id]; const cls=a===undefined?'':(a===q.ans?'g':'b');
    return `<button class="dot ${cls} ${i===st.pos?'cur':''}" data-pos="${i}" aria-label="שאלה ${i+1}">${i+1}</button>`;
  }).join('');
}
function renderCard(){
  const list=visible();
  if(!list.length){$('card').innerHTML='<p>אין שאלות בנושא הזה.</p>';return}
  st.pos=Math.max(0,Math.min(st.pos,list.length-1));
  const q=list[st.pos], perm=st.perm[q.id], chosen=st.answers[q.id], answered=chosen!==undefined;
  const tags=[`<span class="tag">${CATNAME[q.cat]}</span>`];
  if(q.title) tags.push(`<span class="tag hot">${q.title}</span>`);
  let h=`<div class="qhead"><div class="qnum">${st.pos+1} <small>מתוך ${list.length}</small></div><div class="tags">${tags.join('')}</div></div>
    <p class="prompt">${q.prompt||'מה ידפיס הקוד הבא?'}</p>${codeBlock(q.code)}
    <div class="opts" role="group" aria-label="אפשרויות">`;
  perm.forEach((oi,pi)=>{
    let cls='';
    if(answered){ if(oi===q.ans) cls='right'; else if(oi===chosen) cls='wrong'; else cls='dim'; }
    h+=`<button class="opt ${cls}" data-oi="${oi}" ${answered?'disabled':''}><span class="ltr">${LETTERS[pi]}</span><span class="out">${q.cat==='raise'?esc(q.opts[oi].slice(4)):outHtml(q.opts[oi])}</span></button>`;
  });
  h+='</div>';
  if(answered){
    const ok=chosen===q.ans; const rl=LETTERS[perm.indexOf(q.ans)];
    h+=`<div class="verdict ${ok?'ok':'no'}" role="status"><span class="mark">${ok?'✓':'✗'}</span>${ok?'נכון! בחרת בתשובה הנכונה.':`לא נכון. התשובה הנכונה היא ${rl}.`}</div>
    <div class="explain"><h3>איך מגיעים לתשובה</h3><p>${md(q.explain)}</p></div>
    <div class="actual explain"><h3>הפלט בפועל</h3><div class="code mono" dir="ltr">${outHtml(q.out)}</div></div>
    <div class="explain"><h3>למה כל אפשרות נכונה או לא</h3></div><ul class="why">`;
    perm.forEach((oi,pi)=>{
      const right=oi===q.ans, mine=oi===chosen;
      const who=right?`<span class="who g">התשובה הנכונה${mine?' · בחרת בה':''}</span>`:`<span class="who ${mine?'b':''}">${mine?'הבחירה שלך · לא נכונה':'לא נכונה'}</span>`;
      h+=`<li class="${right?'right':''} ${mine?'mine':''}"><span class="ltr">${LETTERS[pi]}</span><div>${who}<p>${md(q.why[oi])}</p></div></li>`;
    });
    h+='</ul>';
  }
  $('card').innerHTML=h;
  $('prev').disabled=st.pos===0;
  $('next').disabled=st.pos===list.length-1;
}
function optHtml(q,oi){ return q.cat==='raise'?esc(q.opts[oi].slice(4)):outHtml(q.opts[oi]); }
const mistakes=()=>st.order.map(i=>Q[i]).filter(q=>st.answers[q.id]!==undefined && st.answers[q.id]!==q.ans);
function renderTabs(){
  const n=mistakes().length, m=$('mCount');
  m.textContent=n; m.classList.toggle('zero',n===0);
  const isM=st.tab==='mistakes';
  $('tabPractice').setAttribute('aria-selected',!isM);
  $('tabMistakes').setAttribute('aria-selected',isM);
  $('practiceView').hidden=isM; $('mistakesView').hidden=!isM;
}
function renderMistakes(){
  const list=mistakes(), v=$('mistakesView');
  if(!list.length){
    const answered=Object.keys(st.answers).length;
    v.innerHTML=`<div class="mempty"><b>${answered?'אין טעויות כרגע':'עוד לא ענית על שאלות'}</b>${answered?'כל שאלה שתענה עליה לא נכון תופיע כאן, עם התשובה הנכונה וההסבר.':'ענה על שאלות בלשונית "תרגול". כל טעות תופיע כאן עם התשובה הנכונה וההסבר.'}</div>`;
    return;
  }
  let h=`<div class="mhead"><h2>${list.length} שאלות לחזרה</h2><p>כל שאלה שענית עליה לא נכון. "לנסות שוב" מוחק את התשובה ומחזיר אותך לשאלה.</p></div>`;
  list.forEach(q=>{
    const mine=st.answers[q.id];
    const tags=[`<span class="tag">${CATNAME[q.cat]}</span>`]; if(q.title) tags.push(`<span class="tag hot">${q.title}</span>`);
    h+=`<article class="card mcard">
      <div class="qhead"><p class="prompt">${q.prompt||'מה ידפיס הקוד הבא?'}</p><div class="tags">${tags.join('')}</div></div>
      ${codeBlock(q.code)}
      <div class="pair">
        <div class="ans mine"><span class="lbl">✗ התשובה שלך</span><span class="out">${optHtml(q,mine)}</span></div>
        <div class="ans good"><span class="lbl">✓ התשובה הנכונה</span><span class="out">${optHtml(q,q.ans)}</span></div>
      </div>
      <div class="explain"><h3>למה זו התשובה הנכונה</h3><p>${md(q.explain)}</p></div>
      <div class="explain"><h3>למה התשובה שלך לא נכונה</h3><p>${md(q.why[mine])}</p></div>
      <div class="mactions"><button class="btn primary" data-retry="${q.id}">לנסות שוב</button></div>
    </article>`;
  });
  v.innerHTML=h;
}
function render(){renderTabs();renderCats();renderStats();renderCard();renderDots();renderMistakes();save()}
function setTab(t){ st.tab=t; try{history.replaceState(null,'',t==='mistakes'?'#mistakes':location.pathname+location.search)}catch(e){} render(); window.scrollTo({top:0}); }

function renderSaved(){
  const el=$('savedLine'); if(!el) return;
  const n=Object.keys(st.answers).length;
  if(!storageOk){ el.className='saved off'; el.textContent='הדפדפן חוסם שמירה מקומית כרגע. השתמש בקוד הגיבוי כדי לשמור את ההתקדמות.'; return; }
  const t=st.savedAt?new Date(st.savedAt).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):'';
  el.className='saved'; el.textContent=`נשמר במחשב הזה${t?' בשעה '+t:''} · ${n} תשובות`;
}
// ---------- events ----------
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tab'); if(tb){setTab(tb.dataset.tab);return}
  const r=e.target.closest('[data-retry]'); if(r){
    const id=+r.dataset.retry; delete st.answers[id]; st.perm[id]=shuffled(4);
    st.cat='all'; st.tab='practice'; st.pos=visible().findIndex(q=>q.id===id);
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    render(); $('card').scrollIntoView({block:'start'}); return }
  const c=e.target.closest('.chip'); if(c){st.cat=c.dataset.cat;st.pos=0;render();return}
  const o=e.target.closest('.opt'); if(o&&!o.disabled){choose(+o.dataset.oi);return}
  const d=e.target.closest('.dot'); if(d){st.pos=+d.dataset.pos;render();$('card').scrollIntoView({behavior:'smooth',block:'start'});return}
});
function choose(oi){const q=visible()[st.pos]; if(st.answers[q.id]!==undefined) return; st.answers[q.id]=oi; render();}
function go(d){const n=visible().length; st.pos=Math.max(0,Math.min(n-1,st.pos+d)); render(); window.scrollTo({top:$('card').offsetTop-12,behavior:'smooth'})}
$('prev').onclick=()=>go(-1);
$('next').onclick=()=>go(1);
$('nextUn').onclick=()=>{
  const list=visible(); for(let k=1;k<=list.length;k++){const i=(st.pos+k)%list.length; if(st.answers[list[i].id]===undefined){st.pos=i;render();return}}
};
$('shuffleBtn').onclick=()=>{st.order=shuffled(Q.length);st.pos=0;render()};
$('resetBtn').onclick=()=>{
  const b=$('confirmBox'); b.hidden=false;
  b.innerHTML='<div class="confirm">למחוק את כל התשובות ולהתחיל מחדש? <button class="btn" id="cYes">כן, לאפס</button><button class="btn" id="cNo">ביטול</button></div>';
  $('cYes').onclick=()=>{st.answers={};st.pos=0;Q.forEach(q=>st.perm[q.id]=shuffled(4));b.hidden=true;render()};
  $('cNo').onclick=()=>{b.hidden=true};
};
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea') || st.tab==='mistakes') return;
  if(e.key>='1'&&e.key<='4'){const q=visible()[st.pos]; if(q) choose(st.perm[q.id][+e.key-1]);}
  else if(e.key==='ArrowLeft') go(1);
  else if(e.key==='ArrowRight') go(-1);
});
if(st.curId!=null){ const i=visible().findIndex(q=>q.id===st.curId); if(i>=0) st.pos=i; }
if(restored){
  const n=Object.keys(st.answers).filter(k=>+k<Q.length).length;
  const w=$('welcome'); w.hidden=false;
  w.innerHTML=`<div class="welcome"><b>ברוך שובך!</b> ענית כבר על ${n} מתוך ${Q.length} שאלות. ממשיכים בדיוק מהשאלה שבה עצרת.<button class="ghost" id="wClose">סגירה</button></div>`;
  $('wClose').onclick=()=>{w.hidden=true};
}
if(location.hash==='#mistakes') st.tab='mistakes';
window.addEventListener('hashchange',()=>{ st.tab=location.hash==='#mistakes'?'mistakes':'practice'; render(); });
render();
})();
</script>

</body>
</html>

lists", "code": "print(sum([[1], [2, 3]], []))", "opts": ["ERR:TypeError", "[1, 2, 3]", "6", "[[1], [2, 3]]"], "ans": 1, "explain": "הארגומנט השני של `sum` הוא ערך ההתחלה. מתחילים מ-`[]` ומחברים אליו כל רשימה: `[] + [1] + [2, 3]`. זה משטח רשימה של רשימות (בצורה איטית).", "why": ["עם ערך התחלה `[]` החיבור חוקי. בלעדיו הייתה שגיאה כי `0 + [1]` לא חוקי.", "נכון.", "sum מחבר את הרשימות ולא את המספרים שבתוכן.", "החיבור משטח רמה אחת."], "title": "טריק", "out": "[1, 2, 3]"}, {"cat": "dicts", "code": "d = dict.fromkeys([\"a\", \"b\"], [])\nd[\"a\"].append(1)\nprint(d)", "opts": ["{'a': [1], 'b': []}", "{'a': [1], 'b': [1]}", "{'a': 1, 'b': []}", "ERR:KeyError"], "ans": 1, "explain": "`fromkeys` משתמש באותו אובייקט כערך לכל המפתחות. כל המפתחות מצביעים על אותה רשימה. הנכון: `{k: [] for k in keys}`.", "why": ["זה מה שמתקבל עם dict comprehension.", "נכון: רשימה אחת משותפת.", "append מוסיף לרשימה, לא מחליף אותה במספר.", "שני המפתחות קיימים."], "title": "טריק", "out": "{'a': [1], 'b': [1]}"}, {"cat": "dicts", "code": "print(len({\"a\": 1, \"a\": 2}), {\"a\": 1} == {\"a\": 1.0})", "opts": ["2 False", "1 True", "1 False", "2 True"], "ans": 1, "explain": "מפתח כפול בליטרל של מילון פשוט דורס את הערך הקודם, אז יש מפתח אחד. השוואת מילונים בודקת מפתחות וערכים, ו-`1 == 1.0`.", "why": ["מפתחות במילון ייחודיים.", "נכון.", "int ו-float באותו ערך שווים.", "יש רק מפתח אחד."], "title": "", "out": "1 True"}, {"cat": "dicts", "code": "d = {\"a\": 1, \"b\": 2}\ndel d[\"a\"]\nd[\"a\"] = 3\nprint(list(d))", "opts": ["['a', 'b']", "['b', 'a']", "['b']", "ERR:KeyError"], "ans": 1, "explain": "מילון שומר על סדר הכנסה. אחרי מחיקה, הכנסה מחדש של a שמה אותו בסוף.", "why": ["a נמחק ונכנס מחדש, אז מקומו הקודם אבד.", "נכון.", "a הוכנס שוב בשורה השלישית.", "השמה למפתח שלא קיים מוסיפה אותו. אין שגיאה."], "title": "", "out": "['b', 'a']"}, {"cat": "strings", "code": "print(\" a b \".split(), \" a b \".split(\" \"))", "opts": ["['a', 'b'] ['a', 'b']", "['a', 'b'] ['', 'a', 'b', '']", "['', 'a', 'b', ''] ['', 'a', 'b', '']", "['a', 'b'] ['', 'a', 'b']"], "ans": 1, "explain": "`split()` בלי ארגומנט מפצל לפי כל רצף רווחים ומתעלם מרווחים בקצוות. `split(' ')` מפצל בכל רווח בודד, אז רווח בהתחלה ובסוף יוצר מחרוזות ריקות.", "why": ["`split(' ')` לא מוחק מחרוזות ריקות.", "נכון.", "`split()` בלי ארגומנט כן מנקה רווחים בקצוות.", "גם הרווח שבסוף יוצר מחרוזת ריקה."], "title": "טריק", "out": "['a', 'b'] ['', 'a', 'b', '']"}, {"cat": "strings", "code": "print(\"\".join(sorted(\"hello\")), max(\"apple\", \"Banana\"))", "opts": ["ehllo Banana", "ehllo apple", "['e', 'h', 'l', 'l', 'o'] apple", "olleh Banana"], "ans": 1, "explain": "`sorted` על מחרוזת מחזיר רשימת תווים ממוינת, ו-`join` מחבר אותה. השוואת מחרוזות היא לפי קוד Unicode, ואותיות קטנות (a = 97) גדולות מאותיות גדולות (B = 66).", "why": ["אותיות גדולות קטנות יותר מאותיות קטנות בקוד Unicode.", "נכון.", "`join` הפך את הרשימה חזרה למחרוזת.", "sorted ממיין ולא הופך."], "title": "טריק", "out": "ehllo apple"}, {"cat": "strings", "code": "print(\"abc\" < \"abd\", \"Z\" < \"a\", [1, 2] < [1, 3], \"10\" < \"9\")", "opts": ["True True True False", "True True True True", "True False True False", "False True True True"], "ans": 1, "explain": "השוואת מחרוזות ורשימות היא לקסיקוגרפית: תו אחרי תו. \"10\" < \"9\" כי משווים '1' מול '9', ולא את המספרים. זה באג נפוץ כשממיינים מספרים ששמורים כטקסט.", "why": ["\"10\" ו-\"9\" הם מחרוזות, אז ההשוואה לפי התו הראשון.", "נכון.", "'Z' הוא 90 ו-'a' הוא 97, אז Z קטן יותר.", "c קטן מ-d, אז \"abc\" < \"abd\" הוא True."], "title": "טריק", "out": "True True True True"}, {"cat": "strings", "code": "print(f\"{3.14159:.2f}|{7:03}|{'hi':>4}|\")", "opts": ["3.14|007|  hi|", "3.14159|7|hi|", "3.14|7  |hi  |", "3.1|007|hi  |"], "ans": 0, "explain": "`.2f`: שתי ספרות אחרי הנקודה. `03`: רוחב 3 עם אפסים מובילים. `>4`: יישור לימין ברוחב 4, כלומר שני רווחים לפני hi.", "why": ["נכון.", "הפורמט שאחרי הנקודתיים משנה את התצוגה.", "`>` מיישר לימין, ומספר מיושר לימין כברירת מחדל.", "`.2f` הוא 2 ספרות אחרי הנקודה, ו-`>` מיישר לימין."], "title": "", "out": "3.14|007|  hi|"}, {"cat": "functions", "code": "def make():\n    c = 0\n    def inc():\n        nonlocal c\n        c += 1\n        return c\n    return inc\n\nf = make()\ng = make()\nprint(f(), f(), g())", "opts": ["1 2 3", "1 2 1", "1 1 1", "ERR:UnboundLocalError"], "ans": 1, "explain": "כל קריאה ל-`make` יוצרת c חדש ו-closure חדש. `nonlocal` מאפשר לשנות את c של הפונקציה העוטפת. f ו-g מחזיקים מונים נפרדים.", "why": ["כל closure מחזיק c משלו, אז g מתחיל מ-1.", "נכון.", "c נשמר בין קריאות ל-f, אז הקריאה השנייה מחזירה 2.", "`nonlocal c` הוא בדיוק מה שמונע את השגיאה הזו."], "title": "טריק מתקדם", "out": "1 2 1"}, {"cat": "functions", "code": "print(*[1, 2, 3], sep=\"-\")", "opts": ["[1, 2, 3]", "1-2-3", "1 2 3", "-1-2-3-"], "ans": 1, "explain": "הכוכבית פורקת את הרשימה לשלושה ארגומנטים נפרדים ל-print, ו-`sep` קובע מה יופיע ביניהם.", "why": ["הכוכבית פירקה את הרשימה, אז היא לא מודפסת כרשימה.", "נכון.", "sep שונה מרווח למקף.", "sep מופיע רק בין ארגומנטים, לא בקצוות."], "title": "", "out": "1-2-3"}, {"cat": "functions", "code": "print(list(map(lambda x: x * 2, filter(lambda x: x > 1, [1, 2, 3]))))", "opts": ["[2, 4, 6]", "[4, 6]", "[False, True, True]", "<map object>"], "ans": 1, "explain": "`filter` משאיר רק איברים שהתנאי עליהם True: 2 ו-3. אחר כך `map` מכפיל כל אחד. `list` הופך את התוצאה לרשימה.", "why": ["filter הוציא את 1 לפני ההכפלה.", "נכון.", "filter מחזיר את האיברים עצמם, לא את תוצאות התנאי.", "בזכות `list(...)` מודפסת רשימה ולא אובייקט map."], "title": "", "out": "[4, 6]"}, {"cat": "functions", "code": "[i for i in range(3)]\nprint(i)", "opts": ["2", "3", "ERR:NameError", "None"], "ans": 2, "explain": "בפייתון 3 משתנה בתוך list comprehension נשאר בתוך ה-comprehension ולא דולף החוצה (בניגוד ללולאת `for` רגילה, שבה i היה נשאר 2).", "why": ["זה היה נכון ללולאת for רגילה.", "גם בלולאה רגילה i לא מגיע ל-3.", "נכון: name 'i' is not defined.", "i לא קיים בכלל מחוץ ל-comprehension."], "title": "באג", "out": "ERR:NameError"}, {"cat": "tricks", "code": "t = (5)\nu = (5,)\nprint(type(t).__name__, type(u).__name__)", "opts": ["tuple tuple", "int tuple", "int int", "tuple int"], "ans": 1, "explain": "סוגריים לבד לא יוצרים tuple, הם רק סוגריים של ביטוי. הפסיק הוא מה שיוצר tuple. לכן `(5)` הוא פשוט המספר 5.", "why": ["`(5)` הוא int. רק `(5,)` הוא tuple.", "נכון.", "הפסיק ב-`(5,)` הופך אותו ל-tuple.", "זה הפוך."], "title": "טריק", "out": "int tuple"}, {"cat": "tricks", "code": "print(round(2.5), round(3.5), round(-0.5))", "opts": ["3 4 -1", "2 4 0", "2 3 0", "3 4 0"], "ans": 1, "explain": "`round` בפייתון משתמש בעיגול בנקאי: כשהמספר בדיוק באמצע, מעגלים למספר הזוגי הקרוב. 2.5 → 2, 3.5 → 4, -0.5 → 0.", "why": ["זה העיגול שלומדים בבית הספר. פייתון מעגל לזוגי.", "נכון.", "3.5 מעוגל ל-4, הזוגי הקרוב.", "2.5 מעוגל ל-2, לא ל-3."], "title": "טריק", "out": "2 4 0"}, {"cat": "tricks", "code": "print(int(\"08\"), int(3.9), int(-3.9))", "opts": ["ERR:ValueError", "8 3 -3", "8 4 -4", "8 3 -4"], "ans": 1, "explain": "`int` על מחרוזת מתעלם מאפסים מובילים. `int` על float חותך את החלק העשרוני לכיוון 0, בלי עיגול. (שונה מ-`//` שמעגל כלפי מטה.)", "why": ["\"08\" היא מחרוזת חוקית ל-int.", "נכון.", "int חותך ולא מעגל.", "int חותך לכיוון 0, אז -3.9 הופך ל-3-. ל-4- מגיעים עם `math.floor`."], "title": "טריק", "out": "8 3 -3"}, {"cat": "tricks", "code": "print(2 ** 3 ** 2, -2 ** 2)", "opts": ["64 4", "512 -4", "64 -4", "512 4"], "ans": 1, "explain": "חזקה מתבצעת מימין לשמאל: `2 ** (3 ** 2)` = 2 בחזקת 9 = 512. וחזקה קודמת למינוס האונרי: `-(2 ** 2)` = -4.", "why": ["`(2 ** 3) ** 2` היה 64, אבל החזקה מתבצעת מימין לשמאל.", "נכון.", "החזקה מימין לשמאל, אז 512.", "המינוס חל אחרי החזקה. `(-2) ** 2` היה 4."], "title": "טריק", "out": "512 -4"}, {"cat": "tricks", "code": "print(True + True, True * 3, sum([True, False, True]))", "opts": ["2 3 2", "True True True", "ERR:TypeError", "1 1 2"], "ans": 0, "explain": "`bool` הוא תת-מחלקה של `int`: True הוא 1 ו-False הוא 0. לכן אפשר לחבר ולספור איתם. `sum` על רשימת bool סופר כמה True יש.", "why": ["נכון.", "החשבון מחזיר int, לא bool.", "חשבון עם bool חוקי לגמרי.", "`True + True` הוא 2, לא 1."], "title": "טריק", "out": "2 3 2"}, {"cat": "tricks", "code": "print(not [] == [], not ([] == []))", "opts": ["True False", "False False", "True True", "False True"], "ans": 1, "explain": "ל-`not` עדיפות נמוכה מ-`==`, אז `not [] == []` הוא `not ([] == [])`. שתי הרשימות הריקות שוות, אז שני הביטויים False.", "why": ["לא מחושב `(not []) == []`, אלא `not ([] == [])`.", "נכון: שני הביטויים זהים בפועל.", "`[] == []` הוא True, ולכן `not` שלו הוא False.", "שני הביטויים זהים בגלל סדר הפעולות."], "title": "טריק", "out": "False False"}, {"cat": "tricks", "code": "print(1 if 0 else 2 if \"\" else 3)", "opts": ["1", "2", "3", "ERR:SyntaxError"], "ans": 2, "explain": "ביטוי תנאי משורשר נקרא כ-`1 if 0 else (2 if \"\" else 3)`. 0 הוא שקר, אז עוברים לחלק השני. מחרוזת ריקה היא שקר, אז מתקבל 3.", "why": ["0 הוא שקר.", "\"\" הוא שקר.", "נכון.", "שרשור של ביטויי תנאי הוא תחביר חוקי."], "title": "", "out": "3"}, {"cat": "tricks", "code": "if (n := len(\"hello\")) > 3:\n    print(n)", "opts": ["True", "5", "hello", "ERR:SyntaxError"], "ans": 1, "explain": "אופרטור הסוס-ים (walrus) `:=`, מפייתון 3.8, משייך ערך ומחזיר אותו באותו ביטוי. n מקבל 5, ו-5 > 3.", "why": ["n מקבל את האורך, לא את תוצאת ההשוואה, בזכות הסוגריים.", "נכון.", "`len` מחזיר מספר.", "`:=` הוא תחביר חוקי מפייתון 3.8."], "title": "", "out": "5"}, {"cat": "tricks", "code": "print(any([]), all([]), any([0, \"\", None, 1]))", "opts": ["False False True", "False True True", "True True True", "False True False"], "ans": 1, "explain": "`any` על רשימה ריקה הוא False: אין אף איבר אמת. `all` על רשימה ריקה הוא True: אין אף איבר שקר (אמת ריקה). ברשימה השלישית יש 1, שהוא אמת.", "why": ["`all([])` מחזיר True. זה מבלבל, אבל זו ההגדרה המתמטית.", "נכון.", "`any([])` הוא False, אין אף ערך אמת.", "1 הוא אמת, אז any מחזיר True."], "title": "טריק", "out": "False True True"}, {"cat": "iter", "code": "g = (x * 10 for x in range(3))\nprint(list(g), list(g))", "opts": ["[0, 10, 20] [0, 10, 20]", "[0, 10, 20] []", "<generator object> []", "[] []"], "ans": 1, "explain": "Generator אפשר לעבור עליו רק פעם אחת. אחרי ש-`list` הראשון צרך את כל הערכים, הוא ריק.", "why": ["רק רשימה אפשר לעבור עליה שוב ושוב.", "נכון.", "`list(g)` צורך את הגנרטור ומחזיר רשימה.", "בפעם הראשונה הגנרטור עוד מלא."], "title": "טריק", "out": "[0, 10, 20] []"}, {"cat": "iter", "code": "def gen():\n    print(\"start\")\n    yield 1\n    print(\"mid\")\n    yield 2\n\ng = gen()\nprint(\"created\")\nprint(next(g))", "opts": ["start\ncreated\n1", "created\nstart\n1", "created\nstart\n1\nmid", "start\n1\ncreated"], "ans": 1, "explain": "קריאה לפונקציית generator לא מריצה את הגוף שלה, היא רק יוצרת אובייקט. הקוד רץ רק עם `next`, ועוצר ב-`yield` הראשון. לכן mid לא מודפס.", "why": ["`gen()` לא מריץ את הגוף, אז start לא מודפס קודם.", "נכון.", "הריצה עוצרת ב-`yield 1`, אז mid לא מגיע.", "שוב, הגוף לא רץ בזמן `gen()`."], "title": "טריק מתקדם", "out": "created\nstart\n1"}, {"cat": "iter", "code": "it = iter([1])\nprint(next(it))\nprint(next(it))", "opts": ["1\n1", "1\nNone", "1\nERR:StopIteration", "1"], "ans": 2, "explain": "`next` על איטרטור שהסתיים זורק `StopIteration`. אפשר לתת ערך ברירת מחדל: `next(it, None)`.", "why": ["האיטרטור לא חוזר להתחלה.", "רק `next(it, None)` היה מחזיר None.", "נכון.", "הקריאה השנייה מבוצעת ונכשלת."], "title": "באג", "out": "1\nERR:StopIteration"}, {"cat": "iter", "code": "m = map(str, [1, 2])\nprint(list(m), list(m))", "opts": ["['1', '2'] ['1', '2']", "['1', '2'] []", "[1, 2] []", "['1', '2']"], "ans": 1, "explain": "`map`, `filter` ו-`zip` מחזירים איטרטורים עצלים, ולא רשימות. כמו generator, אפשר לצרוך אותם פעם אחת.", "why": ["map הוא איטרטור, לא רשימה.", "נכון.", "`str` המיר כל מספר למחרוזת.", "print מדפיס את שני הארגומנטים."], "title": "טריק", "out": "['1', '2'] []"}, {"cat": "iter", "code": "def countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n    return \"done\"\n\nprint(list(countdown(3)), sum(countdown(4)))", "opts": ["[3, 2, 1, 'done'] 10", "[3, 2, 1] 10", "[3, 2, 1, 0] 10", "[3, 2, 1] 6"], "ans": 1, "explain": "`list` אוסף רק את הערכים שעברו דרך `yield`. ה-`return` בגנרטור רק מסיים אותו, והערך שלו לא נכנס לרשימה. `sum` של 4, 3, 2, 1 הוא 10.", "why": ["ערך ה-return לא נאסף.", "נכון.", "הלולאה נעצרת כש-n הוא 0, לפני ה-yield.", "`countdown(4)` מתחיל מ-4."], "title": "", "out": "[3, 2, 1] 10"}, {"cat": "exceptions", "code": "try:\n    1 / 0\nexcept Exception:\n    print(\"general\")\nexcept ZeroDivisionError:\n    print(\"zero\")", "opts": ["zero", "general", "general\nzero", "ERR:ZeroDivisionError"], "ans": 1, "explain": "פייתון בודק את בלוקי ה-except לפי הסדר ונכנס לראשון שמתאים. ZeroDivisionError הוא סוג של Exception, אז הבלוק הראשון תופס. את החריגה הספציפית צריך לשים קודם.", "why": ["כדי שזה יקרה, ה-except הספציפי צריך להופיע לפני הכללי.", "נכון.", "רק except אחד מתבצע.", "החריגה נתפסת."], "title": "טריק", "out": "general"}, {"cat": "exceptions", "code": "def f(x):\n    try:\n        r = 10 / x\n    except ZeroDivisionError:\n        print(\"A\", end=\" \")\n    else:\n        print(\"B\", end=\" \")\n    finally:\n        print(\"C\", end=\" \")\n\nf(2)\nf(0)", "opts": ["B C A C", "A B C A C", "B A C", "C B C A"], "ans": 0, "explain": "`else` רץ רק אם לא הייתה חריגה. `finally` רץ תמיד, אחרון. f(2): אין חריגה, אז B ואז C. f(0): יש חריגה, אז A ואז C.", "why": ["נכון.", "בקריאה הראשונה אין חריגה, אז A לא מודפס.", "finally רץ בשתי הקריאות.", "finally רץ אחרון, לא ראשון."], "title": "", "out": "B C A C"}, {"cat": "exceptions", "code": "try:\n    x = int(\"abc\")\nexcept ValueError as e:\n    x = -1\nfinally:\n    x += 1\nprint(x)", "opts": ["-1", "0", "1", "ERR:ValueError"], "ans": 1, "explain": "ההמרה נכשלת, except נותן ל-x את -1, ואז finally מוסיף 1.", "why": ["finally רץ גם אחרי except.", "נכון.", "x הוא -1 לפני finally, לא 0.", "החריגה נתפסת."], "title": "", "out": "0"}, {"cat": "exceptions", "code": "def check(age):\n    if age < 0:\n        raise ValueError(\"negative\")\n    return age\n\ntry:\n    print(check(5))\n    print(check(-1))\n    print(check(10))\nexcept ValueError as e:\n    print(\"error:\", e)", "opts": ["5\nerror: negative\n10", "5\nerror: negative", "error: negative", "5\n-1\n10"], "ans": 1, "explain": "ברגע שנזרקת חריגה, שאר הבלוק של try מדולג וממשיכים ישר ל-except. לכן `check(10)` לא נקרא.", "why": ["אחרי שנזרקת חריגה, לא חוזרים לתוך try.", "נכון.", "check(5) הצליח והודפס לפני השגיאה.", "-1 גורם ל-raise, הוא לא מוחזר."], "title": "", "out": "5\nerror: negative"}, {"cat": "exceptions", "code": "try:\n    d = {}\n    d[\"x\"]\nexcept (KeyError, IndexError) as e:\n    print(type(e).__name__, e)", "opts": ["KeyError 'x'", "KeyError x", "IndexError 'x'", "ERR:KeyError"], "ans": 0, "explain": "tuple של סוגי חריגות תופס כל אחד מהם. ההודעה של KeyError היא repr של המפתח, ולכן עם גרשיים.", "why": ["נכון.", "KeyError מציג את המפתח עם גרשיים.", "החריגה מסוג KeyError.", "KeyError נמצא ב-tuple, אז החריגה נתפסת."], "title": "", "out": "KeyError 'x'"}, {"cat": "classes", "code": "class A:\n    n = 0\n\n    @classmethod\n    def make(cls):\n        cls.n += 1\n        return cls()\n\nclass B(A):\n    pass\n\nB.make()\nB.make()\nA.make()\nprint(A.n, B.n)", "opts": ["3 3", "1 2", "1 3", "0 2"], "ans": 1, "explain": "ב-classmethod, `cls` הוא המחלקה שעליה קראו. `cls.n += 1` עם cls=B קורא את n מ-A (0), ומשייך את התוצאה ל-B עצמו. מאז ל-B יש n משלו. A.make מעדכן רק את A.", "why": ["משתנה המחלקה לא משותף אחרי ההשמה, כי ההשמה יוצרת n חדש ב-B.", "נכון.", "A.n עודכן רק פעם אחת.", "A.make() העלה את A.n ל-1."], "title": "טריק מתקדם", "out": "1 2"}, {"cat": "classes", "code": "class Box:\n    def __len__(self):\n        return 0\n\nb = Box()\nprint(bool(b), \"yes\" if b else \"no\")", "opts": ["True yes", "False no", "True no", "ERR:TypeError"], "ans": 1, "explain": "כשאין `__bool__`, פייתון משתמש ב-`__len__` כדי לקבוע אמת: אורך 0 הוא שקר. (בלי שתי המתודות, כל אובייקט הוא אמת.)", "why": ["בלי `__len__`, האובייקט היה אמת. כאן `__len__` מחזיר 0.", "נכון.", "bool ו-if משתמשים באותו מנגנון.", "`__len__` מחזיר int חוקי."], "title": "טריק", "out": "False no"}, {"cat": "classes", "code": "class P:\n    def __init__(self, x):\n        self.x = x\n\n    def __eq__(self, other):\n        return self.x == other.x\n\ns = {P(1)}\nprint(len(s))", "opts": ["1", "0", "ERR:TypeError", "ERR:AttributeError"], "ans": 2, "explain": "כשמגדירים `__eq__` בלי `__hash__`, פייתון מגדיר את `__hash__` ל-None, והאובייקט הופך ל-unhashable. לא ניתן להכניס אותו ל-set או להשתמש בו כמפתח במילון.", "why": ["האובייקט לא נכנס ל-set.", "השגיאה נזרקת לפני שה-set נוצר.", "נכון: unhashable type: 'P'.", "x מוגדר ב-`__init__`."], "title": "באג", "out": "ERR:TypeError"}, {"cat": "classes", "code": "class Money:\n    def __init__(self, v):\n        self.v = v\n\n    def __add__(self, other):\n        return Money(self.v + other.v)\n\n    def __repr__(self):\n        return f\"Money({self.v})\"\n\nprint(Money(5) + Money(3))\nprint(sum([Money(1), Money(2)]))", "opts": ["Money(8)\nMoney(3)", "Money(8)\nERR:AttributeError", "Money(8)\nERR:TypeError", "8\n3"], "ans": 2, "explain": "`__add__` מאפשר את `Money(5) + Money(3)`. אבל `sum` מתחיל מ-0 ומחשב קודם `0 + Money(1)`. ה-int לא יודע לחבר Money, ופייתון מחפש `__radd__` (חיבור מצד ימין) ב-Money, שלא הוגדר. התוצאה: TypeError. פתרונות: `sum(items, Money(0))` או להגדיר `__radd__`.", "why": ["`sum` מתחיל מ-0, ו-`0 + Money` לא נתמך.", "Money לא מנסה לגשת לתכונה של int. פייתון עוצר קודם עם TypeError על סוגים לא נתמכים.", "נכון: unsupported operand type(s) for +: 'int' and 'Money'.", "`__repr__` קובע את התצוגה, לכן מודפס `Money(8)` ולא 8."], "title": "טריק מתקדם", "out": "Money(8)\nERR:TypeError"}, {"cat": "poly", "code": "class Base:\n    def __init__(self):\n        self.describe()\n\n    def describe(self):\n        print(\"Base\")\n\nclass Child(Base):\n    def __init__(self):\n        super().__init__()\n        self.name = \"child\"\n\n    def describe(self):\n        print(\"Child\", self.name)\n\nChild()", "opts": ["Base", "Child child", "ERR:AttributeError", "Child None"], "ans": 2, "explain": "הבנאי של Base קורא ל-`self.describe()`. כיוון ש-self הוא בפועל Child, נקראת הגרסה של Child (dynamic dispatch), גם מתוך הבנאי של ההורה. אבל `self.name` מוגדר רק אחרי ש-`super().__init__()` חוזר, ולכן הוא עוד לא קיים.", "why": ["self הוא Child, אז נקראת המתודה הדורסת ולא זו של Base.", "name נקבע רק אחרי שהבנאי של Base מסתיים.", "נכון: 'Child' object has no attribute 'name'.", "תכונה שלא הוגדרה לא שווה None, היא פשוט לא קיימת."], "title": "טריק מתקדם", "out": "ERR:AttributeError"}, {"cat": "poly", "code": "class A:\n    def run(self):\n        self._x()\n        self.__y()\n\n    def _x(self):\n        print(\"A._x\")\n\n    def __y(self):\n        print(\"A.__y\")\n\nclass B(A):\n    def _x(self):\n        print(\"B._x\")\n\n    def __y(self):\n        print(\"B.__y\")\n\nB().run()", "opts": ["B._x\nB.__y", "A._x\nA.__y", "B._x\nA.__y", "ERR:AttributeError"], "ans": 2, "explain": "קו תחתון אחד (`_x`) הוא רק מוסכמה, והמתודה נדרסת כרגיל. שני קווים תחתונים (`__y`) מפעילים name mangling: בתוך A השם הופך ל-`_A__y`, ובתוך B ל-`_B__y`. אלה שני שמות שונים, ולכן B לא דורס את `__y`.", "why": ["`__y` לא נדרס בגלל name mangling.", "`_x` כן נדרס, הקו התחתון האחד לא מגן עליו.", "נכון.", "`_A__y` קיים ב-A, אז אין שגיאה."], "title": "טריק מתקדם", "out": "B._x\nA.__y"}, {"cat": "poly", "code": "class Calc:\n    def add(self, a, b):\n        return a + b\n\n    def add(self, a, b, c):\n        return a + b + c\n\nprint(Calc().add(1, 2))", "opts": ["3", "None", "ERR:TypeError", "ERR:SyntaxError"], "ans": 2, "explain": "בפייתון אין העמסת מתודות (overloading) כמו ב-Java. ההגדרה השנייה של `add` פשוט דורסת את הראשונה, ונשארת רק הגרסה עם 3 פרמטרים. ב-Python מקבלים התנהגות דומה עם ערכי ברירת מחדל או `*args`.", "why": ["זה היה נכון ב-Java או C++. בפייתון רק ההגדרה האחרונה נשארת.", "הקריאה נכשלת לפני שמשהו מוחזר.", "נכון: add() missing 1 required positional argument: 'c'.", "הגדרה כפולה של שם היא תחביר חוקי. היא פשוט דורסת."], "title": "טריק קלאסי", "out": "ERR:TypeError"}, {"cat": "poly", "code": "class Duck:\n    def sound(self):\n        return \"Quack\"\n\nclass Robot:\n    def sound(self):\n        return \"Beep\"\n\nfor x in [Duck(), Robot()]:\n    print(x.sound(), end=\" \")", "opts": ["Quack Beep", "Quack", "ERR:TypeError", "ERR:AttributeError"], "ans": 0, "explain": "Duck typing: פייתון לא בודק מאיזו מחלקה האובייקט יורש, רק אם יש לו את המתודה. Duck ו-Robot לא קשורים בירושה, ובכל זאת שניהם עובדים באותה לולאה. \"אם זה מגעגע כמו ברווז, זה ברווז\".", "why": ["נכון.", "גם ל-Robot יש `sound`, אז הלולאה ממשיכה.", "לא צריך מחלקת אב משותפת כדי לקרוא לאותה מתודה.", "לשני האובייקטים יש `sound`."], "title": "", "out": "Quack Beep"}, {"cat": "poly", "code": "class A:\n    pass\n\nclass B(A):\n    pass\n\nb = B()\nprint(isinstance(b, A), type(b) == A, issubclass(A, B))", "opts": ["True True False", "True False False", "False False False", "True False True"], "ans": 1, "explain": "`isinstance` מתחשב בירושה: B הוא סוג של A. `type(b)` מחזיר בדיוק B, אז השוואה ל-A היא False. `issubclass(A, B)` שואל אם A יורש מ-B, וזה הפוך.", "why": ["`type()` מחזיר את המחלקה המדויקת, בלי להתחשב בירושה.", "נכון.", "isinstance כן מכיר בירושה.", "A הוא ההורה, לא הילד."], "title": "טריק", "out": "True False False"}, {"cat": "poly", "code": "from abc import ABC, abstractmethod\n\nclass Shape(ABC):\n    @abstractmethod\n    def area(self):\n        ...\n\nclass Square(Shape):\n    def __init__(self, s):\n        self.s = s\n\nsq = Square(2)\nprint(\"ok\")", "opts": ["ok", "None", "ERR:TypeError", "ERR:NotImplementedError"], "ans": 2, "explain": "Square יורש ממחלקה אבסטרקטית אבל לא מימש את `area`, ולכן גם הוא נחשב אבסטרקטי. השגיאה נזרקת כבר ביצירת האובייקט, לא בקריאה ל-area.", "why": ["אי אפשר ליצור מופע כל עוד יש מתודה אבסטרקטית שלא מומשה.", "האובייקט לא נוצר בכלל.", "נכון: Can't instantiate abstract class Square.", "NotImplementedError זורקים ידנית. ABC זורק TypeError ביצירה."], "title": "באג", "out": "ERR:TypeError"}, {"cat": "poly", "code": "class Animal:\n    def __init__(self, name):\n        self.name = name\n\nclass Dog(Animal):\n    def __init__(self, breed):\n        self.breed = breed\n\nd = Dog(\"Husky\")\nprint(d.breed, d.name)", "opts": ["Husky Husky", "Husky None", "ERR:AttributeError", "ERR:TypeError"], "ans": 2, "explain": "Dog דרס את `__init__` ולא קרא ל-`super().__init__(...)`. הבנאי של Animal לא רץ, ולכן `name` לא קיים. התיקון: לקבל גם name ולקרוא `super().__init__(name)`.", "why": ["\"Husky\" נשמר רק ב-breed.", "name לא הוגדר בכלל, הוא לא None.", "נכון: 'Dog' object has no attribute 'name'.", "Dog מקבל ארגומנט אחד ונשלח אחד, אז הקריאה תקינה."], "title": "באג", "out": "ERR:AttributeError"}, {"cat": "poly", "code": "class Shape:\n    def area(self):\n        return 0\n\n    def describe(self):\n        return f\"{type(self).__name__}: {self.area()}\"\n\nclass Sq(Shape):\n    def __init__(self, s):\n        self.s = s\n\n    def area(self):\n        return self.s ** 2\n\nclass Circle(Shape):\n    pass\n\nfor s in [Sq(3), Circle(), Shape()]:\n    print(s.describe())", "opts": ["Shape: 9\nShape: 0\nShape: 0", "Sq: 9\nCircle: 0\nShape: 0", "Sq: 9\nCircle: None\nShape: 0", "Sq: 0\nCircle: 0\nShape: 0"], "ans": 1, "explain": "`describe` מוגדרת רק ב-Shape, אבל `type(self)` ו-`self.area()` נקבעים לפי האובייקט בפועל. Sq דרס את area. Circle לא דרס כלום, אז הוא יורש את area של Shape שמחזירה 0.", "why": ["`type(self)` מחזיר את המחלקה האמיתית, לא את המחלקה שבה המתודה כתובה.", "נכון: זה פולימורפיזם קלאסי.", "Circle יורש את area של Shape, שמחזירה 0.", "`self.area()` ב-Sq קורא לגרסה הדורסת."], "title": "", "out": "Sq: 9\nCircle: 0\nShape: 0"}, {"cat": "poly", "code": "class A:\n    greeting = \"hi\"\n\n    def greet(self):\n        return self.greeting\n\n    def greet2(self):\n        return A.greeting\n\nclass B(A):\n    greeting = \"shalom\"\n\nprint(B().greet(), B().greet2())", "opts": ["hi hi", "shalom shalom", "shalom hi", "hi shalom"], "ans": 2, "explain": "`self.greeting` מחפש קודם במופע, אחר כך ב-B ואז ב-A, ולכן מוצא את shalom של B. `A.greeting` פונה ישירות למחלקה A, בלי פולימורפיזם.", "why": ["`self.greeting` מוצא את הגרסה של B.", "`A.greeting` קבוע ל-A ולא מושפע מ-B.", "נכון.", "זה הפוך."], "title": "טריק", "out": "shalom hi"}, {"cat": "poly", "code": "class V:\n    def __init__(self, x):\n        self.x = x\n\n    def __add__(self, other):\n        return f\"add {other}\"\n\n    def __radd__(self, other):\n        return f\"radd {other}\"\n\nv = V(1)\nprint(v + 1, 1 + v)", "opts": ["add 1 add 1", "add 1 radd 1", "add 1 ERR:TypeError", "radd 1 add 1"], "ans": 1, "explain": "ב-`v + 1` נקרא `v.__add__(1)`. ב-`1 + v`, ה-int לא יודע לחבר V ומחזיר NotImplemented, אז פייתון מנסה את הצד הימני: `v.__radd__(1)`.", "why": ["`1 + v` לא קורא ל-`__add__` של V, כי V נמצא מימין.", "נכון.", "בזכות `__radd__` אין שגיאה.", "האופרנד השמאלי קובע: v משמאל מפעיל `__add__`."], "title": "טריק מתקדם", "out": "add 1 radd 1"}, {"cat": "poly", "code": "class A:\n    def __eq__(self, other):\n        return True\n\nclass B:\n    pass\n\nprint(A() == B(), B() == A())", "opts": ["True False", "True True", "False False", "False True"], "ans": 1, "explain": "`A() == B()` קורא ל-`A.__eq__` ומחזיר True. ב-`B() == A()`, ה-`__eq__` של B (ברירת המחדל של object) מחזיר NotImplemented כי אלה סוגים שונים, ופייתון מנסה את ההשוואה ההפוכה: `A.__eq__`. גם היא מחזירה True.", "why": ["פייתון מנסה גם את הצד השני כשהראשון לא יודע להשוות.", "נכון: ההשוואה \"מתהפכת\" אוטומטית.", "`A.__eq__` מחזיר תמיד True.", "השוואה ראשונה קוראת ישירות ל-`A.__eq__`."], "title": "טריק מתקדם", "out": "True True"}, {"cat": "poly", "code": "class A:\n    @staticmethod\n    def who():\n        return \"A\"\n\n    def show(self):\n        return self.who()\n\nclass B(A):\n    @staticmethod\n    def who():\n        return \"B\"\n\nprint(A().show(), B().show(), A.show(B()))", "opts": ["A B A", "A B B", "A A A", "ERR:TypeError"], "ans": 1, "explain": "גם static method נמצא דרך `self`, ולכן הוא פולימורפי. `A.show(B())` קורא לפונקציה של A, אבל self הוא B, אז `self.who()` מחזיר B.", "why": ["מה שקובע הוא self, לא המחלקה שדרכה קראנו ל-show.", "נכון.", "`self.who()` מוצא את הגרסה של B כש-self הוא B.", "מותר לקרוא ל-`A.show` ולהעביר self ידנית."], "title": "טריק", "out": "A B B"}, {"cat": "poly", "code": "class A:\n    def f(self):\n        return \"A.f -> \" + self.g()\n\n    def g(self):\n        return \"A.g\"\n\nclass B(A):\n    def f(self):\n        return \"B.f -> \" + A.f(self)\n\n    def g(self):\n        return \"B.g\"\n\nprint(B().f())", "opts": ["B.f -> A.f -> A.g", "B.f -> A.f -> B.g", "A.f -> B.g", "ERR:RecursionError"], "ans": 1, "explain": "`B.f` קורא במפורש ל-`A.f`. אבל בתוך A.f, ה-self הוא עדיין אובייקט B, אז `self.g()` הולך ל-`B.g`. קריאה לקוד של ההורה לא \"מחליפה\" את self.", "why": ["self נשאר B גם בתוך A.f.", "נכון.", "B.f רץ ראשון ומוסיף את הטקסט שלו.", "A.f לא קורא ל-f שוב, אז אין רקורסיה."], "title": "טריק מתקדם", "out": "B.f -> A.f -> B.g"}, {"cat": "poly", "code": "class Team:\n    def __init__(self):\n        self.members = [\"a\", \"b\", \"c\"]\n\n    def __len__(self):\n        return len(self.members)\n\n    def __getitem__(self, i):\n        return self.members[i]\n\nt = Team()\nprint(len(t), t[-1], \"b\" in t)", "opts": ["3 c True", "3 c ERR:TypeError", "3 a True", "ERR:TypeError"], "ans": 0, "explain": "`len()` קורא ל-`__len__` ו-`t[-1]` קורא ל-`__getitem__`. גם בלי `__contains__`, האופרטור `in` עובד: פייתון עובר על האיברים עם `__getitem__` (0, 1, 2...) עד ש-IndexError עוצר אותו.", "why": ["נכון.", "`in` משתמש ב-`__getitem__` כגיבוי, אז אין שגיאה.", "`-1` הוא האיבר האחרון.", "len עובד כי הוגדר `__len__`."], "title": "טריק מתקדם", "out": "3 c True"}, {"cat": "poly", "code": "class A:\n    def hello(self):\n        return \"class\"\n\na = A()\na.hello = lambda: \"instance\"\nprint(a.hello(), A().hello())", "opts": ["class class", "instance instance", "instance class", "ERR:TypeError"], "ans": 2, "explain": "השמה של פונקציה לתכונה במופע מסתירה את המתודה של המחלקה, רק עבור אותו מופע. ה-lambda לא מקבלת self, כי היא לא מתודה. היא סתם פונקציה ששמורה במופע.", "why": ["המופע a קיבל פונקציה משלו שקודמת למתודה של המחלקה.", "רק a שונה. מופע חדש משתמש במתודה של המחלקה.", "נכון.", "פונקציה ששמורה במופע לא מקבלת self אוטומטית, ולכן lambda בלי פרמטרים עובדת."], "title": "טריק", "out": "instance class"}, {"cat": "poly", "code": "class Base:\n    def area(self, scale=1):\n        return 10 * scale\n\nclass Sub(Base):\n    def area(self):\n        return 5\n\nshapes = [Base(), Sub()]\nprint([s.area(2) for s in shapes])", "opts": ["[20, 5]", "[20, 10]", "ERR:TypeError", "[20, None]"], "ans": 2, "explain": "Sub דרס את area עם חתימה שונה, שלא מקבלת scale. קוד שעובד פולימורפית על רשימת Shapes נשבר כשמגיע ל-Sub. זה הפרה של עקרון ההחלפה של ליסקוב (LSP): מתודה דורסת צריכה לקבל את אותם ארגומנטים.", "why": ["Sub.area לא מקבלת ארגומנט, אז הקריאה עם 2 נכשלת.", "פייתון לא נופל חזרה לגרסה של Base.", "נכון: area() takes 1 positional argument but 2 were given.", "הקריאה נכשלת לפני שמשהו מוחזר."], "title": "באג", "out": "ERR:TypeError"}, {"cat": "poly", "code": "print(isinstance(True, int), True == 1, type(True) is int)", "opts": ["True True True", "True True False", "False True False", "False False False"], "ans": 1, "explain": "`bool` יורש מ-`int`, ולכן True הוא גם int (isinstance) ושווה ל-1. אבל הטיפוס המדויק שלו הוא bool ולא int.", "why": ["`type(True)` הוא bool.", "נכון.", "bool הוא תת-מחלקה של int, אז isinstance מחזיר True.", "True == 1 נכון בפייתון."], "title": "טריק", "out": "True True False"}, {"cat": "poly", "code": "class Animal:\n    def __init__(self, n):\n        self.n = n\n\n    def __str__(self):\n        return f\"{type(self).__name__}({self.n})\"\n\nclass Cat(Animal):\n    pass\n\nprint(Cat(\"Tom\"), Animal(\"Rex\"))", "opts": ["Animal(Tom) Animal(Rex)", "Cat(Tom) Animal(Rex)", "Cat(Tom) Cat(Rex)", "<__main__.Cat object at 0x…> Animal(Rex)"], "ans": 1, "explain": "Cat יורש את `__str__`, ו-`type(self).__name__` מחזיר את השם של המחלקה בפועל. כך מתודה אחת בהורה מתאימה את עצמה לכל ילד.", "why": ["`type(self)` דינמי, לא קבוע ל-Animal.", "נכון.", "Animal(\"Rex\") הוא Animal.", "`__str__` עובר בירושה ל-Cat."], "title": "", "out": "Cat(Tom) Animal(Rex)"}]</script>
<script>
(function(){
const Q = JSON.parse(document.getElementById('data').textContent);
Q.forEach((q,i)=>q.id=i);
const CATS = [
  ['all','הכול'],['lists','רשימות'],['dicts','מילונים'],['strings','מחרוזות'],
  ['functions','פונקציות'],['classes','מחלקות'],['poly','פולימורפיזם'],['iter','גנרטורים'],['exceptions','חריגות'],['tricks','טריקים'],['bugs','באגים ושגיאות'],['mine','מהקוד שלך']
];
const CATNAME = Object.fromEntries(CATS);
const LETTERS = ['א','ב','ג','ד'];
const isBug = q => q.out.includes('ERR:') || /באג/.test(q.title);
const inCat = (q,c) => c==='all' || q.cat===c || (c==='bugs' && isBug(q)) || (c==='mine' && q.title==='מהקוד שלך');

const KEY='mah-hapelet-v1';
let st = {answers:{}, perm:{}, order:null, cat:'all', pos:0, curId:null, savedAt:null};
let restored=false;
let storageOk=true;
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.answers){ st=Object.assign(st,s); restored=Object.keys(s.answers).length>0; } }catch(e){storageOk=false}
const save=()=>{
  const q=visible()[st.pos]; if(q) st.curId=q.id;
  try{ st.savedAt=Date.now(); localStorage.setItem(KEY,JSON.stringify(st)); storageOk=true; }catch(e){ storageOk=false; }
  renderSaved();
};

function shuffled(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
Q.forEach(q=>{ if(!st.perm[q.id]) st.perm[q.id]=shuffled(4); });
if(!st.order) st.order=Q.map(q=>q.id);
st.order=st.order.filter(i=>i<Q.length);
Q.forEach(q=>{ if(!st.order.includes(q.id)) st.order.push(q.id); });

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');

// ---------- syntax highlighting ----------
const KW=new Set('def class return if elif else for while in not and or is None True False try except finally with as import from lambda pass break continue global nonlocal yield raise del assert'.split(' '));
const BI=new Set('print len range list dict set tuple str int float bool sorted zip enumerate repr round min max sum super isinstance type open input abs map filter'.split(' '));
const TOK=/(#.*$)|((?:f|r|b)?(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'))|(@\w+)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*\b)/gm;
function hl(line){
  let out='',last=0,m,prevKw=''; TOK.lastIndex=0;
  while((m=TOK.exec(line))){
    out+=esc(line.slice(last,m.index)); last=TOK.lastIndex;
    const t=m[0];
    if(m[1]) out+=`<span class="tk-cm">${esc(t)}</span>`;
    else if(m[2]) out+=`<span class="tk-str">${esc(t)}</span>`;
    else if(m[3]) out+=`<span class="tk-dec">${esc(t)}</span>`;
    else if(m[4]) out+=`<span class="tk-num">${t}</span>`;
    else if(KW.has(t)){ out+=`<span class="tk-kw">${t}</span>`; prevKw=t; continue; }
    else if(prevKw==='def'||prevKw==='class') out+=`<span class="tk-fn">${t}</span>`;
    else if(BI.has(t)||t==='self') out+=`<span class="tk-bi">${t}</span>`;
    else out+=esc(t);
    prevKw='';
  }
  return out+esc(line.slice(last));
}
function codeBlock(src){
  const rows=src.split('\n').map((l,i)=>`<tr><td class="ln">${i+1}</td><td>${hl(l)||' '}</td></tr>`).join('');
  return `<div class="code" dir="ltr"><table>${rows}</table></div>`;
}
function outHtml(s){
  return s.split('\n').map(l=> l.startsWith('ERR:') ? `<span class="err">שגיאה</span>${esc(l.slice(4))}` : esc(l)).join('\n');
}

// ---------- rendering ----------
const $=id=>document.getElementById(id);
const visible=()=>st.order.map(i=>Q[i]).filter(q=>inCat(q,st.cat));

function renderCats(){
  $('cats').innerHTML=CATS.map(([k,n])=>{
    const c=Q.filter(q=>inCat(q,k)).length;
    return `<button class="chip" data-cat="${k}" aria-pressed="${st.cat===k}">${n}<small>${c}</small></button>`;
  }).join('');
}
function renderStats(){
  const list=visible();
  const ans=list.filter(q=>st.answers[q.id]!==undefined);
  const ok=ans.filter(q=>st.answers[q.id]===q.ans).length;
  $('sScore').textContent=ok;
  $('sDone').textContent=`${ans.length}/${list.length}`;
  $('sPct').textContent=ans.length?Math.round(ok/ans.length*100)+'%':'–';
  $('pG').style.width=(list.length?ok/list.length*100:0)+'%';
  $('pB').style.width=(list.length?(ans.length-ok)/list.length*100:0)+'%';
  const done=$('doneBox');
  if(list.length && ans.length===list.length){
    done.hidden=false;
    done.innerHTML=`<div class="done"><b>סיימת את כל ${list.length} השאלות בנושא "${CATNAME[st.cat]}"</b>ענית נכון על ${ok} מתוך ${list.length}. אפשר לעבור לנושא אחר, או לאפס ולנסות שוב.</div>`;
  } else done.hidden=true;
}
function renderDots(){
  const list=visible();
  $('dots').innerHTML=list.map((q,i)=>{
    const a=st.answers[q.id]; const cls=a===undefined?'':(a===q.ans?'g':'b');
    return `<button class="dot ${cls} ${i===st.pos?'cur':''}" data-pos="${i}" aria-label="שאלה ${i+1}">${i+1}</button>`;
  }).join('');
}
function renderCard(){
  const list=visible();
  if(!list.length){$('card').innerHTML='<p>אין שאלות בנושא הזה.</p>';return}
  st.pos=Math.max(0,Math.min(st.pos,list.length-1));
  const q=list[st.pos], perm=st.perm[q.id], chosen=st.answers[q.id], answered=chosen!==undefined;
  const tags=[`<span class="tag">${CATNAME[q.cat]}</span>`];
  if(q.title) tags.push(`<span class="tag hot">${q.title}</span>`);
  let h=`<div class="qhead"><div class="qnum">${st.pos+1} <small>מתוך ${list.length}</small></div><div class="tags">${tags.join('')}</div></div>
    <p class="prompt">מה ידפיס הקוד הבא?</p>${codeBlock(q.code)}
    <div class="opts" role="group" aria-label="אפשרויות">`;
  perm.forEach((oi,pi)=>{
    let cls='';
    if(answered){ if(oi===q.ans) cls='right'; else if(oi===chosen) cls='wrong'; else cls='dim'; }
    h+=`<button class="opt ${cls}" data-oi="${oi}" ${answered?'disabled':''}><span class="ltr">${LETTERS[pi]}</span><span class="out">${outHtml(q.opts[oi])}</span></button>`;
  });
  h+='</div>';
  if(answered){
    const ok=chosen===q.ans; const rl=LETTERS[perm.indexOf(q.ans)];
    h+=`<div class="verdict ${ok?'ok':'no'}" role="status"><span class="mark">${ok?'✓':'✗'}</span>${ok?'נכון! בחרת בתשובה הנכונה.':`לא נכון. התשובה הנכונה היא ${rl}.`}</div>
    <div class="explain"><h3>איך מגיעים לתשובה</h3><p>${md(q.explain)}</p></div>
    <div class="actual explain"><h3>הפלט בפועל</h3><div class="code mono" dir="ltr">${outHtml(q.out)}</div></div>
    <div class="explain"><h3>למה כל אפשרות נכונה או לא</h3></div><ul class="why">`;
    perm.forEach((oi,pi)=>{
      const right=oi===q.ans, mine=oi===chosen;
      const who=right?`<span class="who g">התשובה הנכונה${mine?' · בחרת בה':''}</span>`:`<span class="who ${mine?'b':''}">${mine?'הבחירה שלך · לא נכונה':'לא נכונה'}</span>`;
      h+=`<li class="${right?'right':''} ${mine?'mine':''}"><span class="ltr">${LETTERS[pi]}</span><div>${who}<p>${md(q.why[oi])}</p></div></li>`;
    });
    h+='</ul>';
  }
  $('card').innerHTML=h;
  $('prev').disabled=st.pos===0;
  $('next').disabled=st.pos===list.length-1;
}
function render(){renderCats();renderStats();renderCard();renderDots();save()}

function renderSaved(){
  const el=$('savedLine'); if(!el) return;
  const n=Object.keys(st.answers).length;
  if(!storageOk){ el.className='saved off'; el.textContent='הדפדפן חוסם שמירה מקומית כרגע. השתמש בקוד הגיבוי כדי לשמור את ההתקדמות.'; return; }
  const t=st.savedAt?new Date(st.savedAt).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):'';
  el.className='saved'; el.textContent=`נשמר במחשב הזה${t?' בשעה '+t:''} · ${n} תשובות`;
}
// ---------- events ----------
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(c){st.cat=c.dataset.cat;st.pos=0;render();return}
  const o=e.target.closest('.opt'); if(o&&!o.disabled){choose(+o.dataset.oi);return}
  const d=e.target.closest('.dot'); if(d){st.pos=+d.dataset.pos;render();$('card').scrollIntoView({behavior:'smooth',block:'start'});return}
});
function choose(oi){const q=visible()[st.pos]; if(st.answers[q.id]!==undefined) return; st.answers[q.id]=oi; render();}
function go(d){const n=visible().length; st.pos=Math.max(0,Math.min(n-1,st.pos+d)); render(); window.scrollTo({top:$('card').offsetTop-12,behavior:'smooth'})}
$('prev').onclick=()=>go(-1);
$('next').onclick=()=>go(1);
$('nextUn').onclick=()=>{
  const list=visible(); for(let k=1;k<=list.length;k++){const i=(st.pos+k)%list.length; if(st.answers[list[i].id]===undefined){st.pos=i;render();return}}
};
$('shuffleBtn').onclick=()=>{st.order=shuffled(Q.length);st.pos=0;render()};
$('resetBtn').onclick=()=>{
  const b=$('confirmBox'); b.hidden=false;
  b.innerHTML='<div class="confirm">למחוק את כל התשובות ולהתחיל מחדש? <button class="btn" id="cYes">כן, לאפס</button><button class="btn" id="cNo">ביטול</button></div>';
  $('cYes').onclick=()=>{st.answers={};st.pos=0;Q.forEach(q=>st.perm[q.id]=shuffled(4));b.hidden=true;render()};
  $('cNo').onclick=()=>{b.hidden=true};
};
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  if(e.key>='1'&&e.key<='4'){const q=visible()[st.pos]; if(q) choose(st.perm[q.id][+e.key-1]);}
  else if(e.key==='ArrowLeft') go(1);
  else if(e.key==='ArrowRight') go(-1);
});
if(st.curId!=null){ const i=visible().findIndex(q=>q.id===st.curId); if(i>=0) st.pos=i; }
if(restored){
  const n=Object.keys(st.answers).filter(k=>+k<Q.length).length;
  const w=$('welcome'); w.hidden=false;
  w.innerHTML=`<div class="welcome"><b>ברוך שובך!</b> ענית כבר על ${n} מתוך ${Q.length} שאלות. ממשיכים בדיוק מהשאלה שבה עצרת.<button class="ghost" id="wClose">סגירה</button></div>`;
  $('wClose').onclick=()=>{w.hidden=true};
}
render();
})();
</script>

</body>
